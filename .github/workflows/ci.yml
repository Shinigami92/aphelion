name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read # to fetch code (actions/checkout)

concurrency:
  # PRs group by PR number so a new push cancels the previous run.
  # Everything else (push to main, merge_group) gets a unique group via
  # run_id, so main-branch pipelines are never canceled by a following commit.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node_version: [24, 26]
      fail-fast: false
    timeout-minutes: 10

    name: 'Test & Validate: node-${{ matrix.node_version }}'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `devEngines.packageManager` in package.json pins the exact version;
      # pnpm switches to it on first run.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Set node version to ${{ matrix.node_version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node_version }}
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm run test
        env:
          CI_PREFLIGHT: true

      # Reads published landmarks back out of every committed ephemeris and
      # elevation grid. Needs no network and no browser.
      - name: Validate astronomy
        run: pnpm run validate

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: 'Lint & Format: node-26'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Set node version to 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint --format=github

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: 'TS-Check & Build: node-26'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Set node version to 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run ts-check

      - name: Build
        run: pnpm run build

      # The built site is ~130 MB, almost all of it committed planetary imagery
      # and topography. Well inside the 1 GB GitHub Pages limit.
      - name: Report bundle size
        run: du -sh dist dist/textures dist/shapes
