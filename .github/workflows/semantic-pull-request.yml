name: Semantic Pull Request

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
  merge_group:

permissions: {}

jobs:
  main:
    permissions:
      pull-requests: read # to analyze PRs (amannn/action-semantic-pull-request)
      statuses: write # to mark status of analyzed PR (amannn/action-semantic-pull-request)

    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Semantic Pull Request
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            infra
            ci
            chore
            revert
