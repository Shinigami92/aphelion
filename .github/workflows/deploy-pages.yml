name: Deploy to GitHub Pages

# Security note: this workflow interpolates no event data. The only ${{ }}
# expression is an action output (page_url) used in `environment.url`, never in a
# `run:` block, so there is no path for workflow injection via branch names,
# commit messages or PR titles.

on:
  # Pull requests are built and checked by ci.yml; only main is deployed.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. Queued runs are not cancelled: a half-finished
# deploy of a 130 MB site is worse than waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `devEngines.packageManager` in package.json pins the exact version;
      # pnpm switches to it on first run.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0

      # Node 24+ runs the TypeScript scripts directly via type stripping.
      - name: Set node version to 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Deploy
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
